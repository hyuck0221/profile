<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="hshim studio 기록" />
    <title>hshim - 기록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260907-image-lightbox" />
    <link rel="stylesheet" href="./post.css?v=20260907-image-lightbox" />
  </head>
  <body class="post-page">
    <a class="skip-link" href="#post-main">본문으로 건너뛰기</a>

    <header class="post-header">
      <div class="post-header__inner page-shell">
        <a class="wordmark" href="./index.html" aria-label="hshim studio 홈으로 이동">
          <span class="wordmark__mark" aria-hidden="true">↗</span>
          <span>hshim studio</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a class="site-nav__link" href="./index.html">프로필</a>
          <a class="site-nav__link is-active" href="./journal.html" aria-current="page">기록</a>
          <a class="site-nav__link" href="./projects.html">프로젝트</a>
          <a class="site-nav__link" href="./contact.html">문의</a>
        </nav>
      </div>
    </header>

    <main id="post-main">
      <div class="post-shell page-shell" id="post-root" aria-live="polite">
        <p class="post-loading">기록을 불러오는 중입니다.</p>
      </div>
    </main>

    <dialog class="image-dialog" id="image-dialog" aria-labelledby="image-dialog-title">
      <div class="image-dialog__surface">
        <div class="image-dialog__header">
          <p class="image-dialog__title" id="image-dialog-title">이미지 보기</p>
          <button class="image-dialog__close" type="button" data-image-dialog-close>닫기</button>
        </div>
        <div class="image-dialog__viewport" data-image-dialog-viewport>
          <img class="image-dialog__image" data-image-dialog-image alt="" />
        </div>
        <div class="image-dialog__controls" role="group" aria-label="이미지 확대 및 축소">
          <button class="image-dialog__control" type="button" data-image-zoom-out aria-label="이미지 축소" title="축소">−</button>
          <output class="image-dialog__zoom" data-image-zoom-value aria-live="polite">100%</output>
          <button class="image-dialog__control" type="button" data-image-zoom-in aria-label="이미지 확대" title="확대">+</button>
          <button class="image-dialog__reset" type="button" data-image-zoom-reset>원본 크기</button>
        </div>
      </div>
    </dialog>

    <script src="./rich-text.js?v=20260831-rich-text" defer></script>
    <script src="./post.js?v=20260907-image-lightbox" defer></script>
  </body>
</html>
